<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Reports · AeroClean</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body data-allowed="personnel">
<div class="shell">
  <header class="topbar">
    <div class="topbar-start" id="topbar-menu"></div>
    <div class="brand is-left">
      <div class="brand-mark">A</div>
      <div class="brand-name">Aero<span>Clean</span></div>
    </div>
  </header>

  <main class="main">
    <div class="menu-root" id="app-menu"></div>

    <div class="row-between" style="margin-bottom:18px; flex-wrap:wrap; gap:12px; align-items:center">
      <div>
        <h1 class="card-title">My Reports</h1>
        <p class="muted">Reports you have submitted</p>
      </div>
      <button type="button" class="btn btn-primary" id="create-report-btn">Create Report</button>
    </div>

    <section class="stats" style="margin-bottom:18px">
      <div class="stat">
        <div class="stat-label">Total Submitted</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">This Month</div>
        <div class="stat-value" id="stat-month">0</div>
      </div>
    </section>

    <section class="card" style="margin-bottom:18px">
      <div class="table-wrap" id="reports-wrap">
        <table class="reports-table">
          <thead>
            <tr>
              <th>Device</th>
              <th>Type</th>
              <th>Date</th>
              <th>Time</th>
              <th>Note</th>
            </tr>
          </thead>
          <tbody id="reports-body"></tbody>
        </table>
      </div>
      <p class="empty" id="reports-empty" hidden>No reports submitted yet. Click "Create Report" to log an issue.</p>

      <div class="pagination" id="pagination" style="display:flex; justify-content:center; gap:6px; margin-top:16px; flex-wrap:wrap"></div>
    </section>
  </main>
</div>

<div id="toast-root"></div>

<div class="modal-backdrop" id="report-modal-backdrop" hidden></div>
<div class="modal report-detail-modal" id="report-detail-modal" role="dialog" aria-modal="true" aria-labelledby="report-detail-title" hidden>
  <div class="modal-header">
    <h2 class="modal-title" id="report-detail-title">Report Details</h2>
    <button class="modal-close" id="report-detail-close" aria-label="Close modal">&times;</button>
  </div>
  <div class="modal-content">
    <div class="report-detail-field">
      <span class="report-detail-label">Device:</span>
      <span class="report-detail-value" id="detail-device"></span>
    </div>
    <div class="report-detail-field">
      <span class="report-detail-label">Type:</span>
      <span class="report-detail-value" id="detail-type"></span>
    </div>
    <div class="report-detail-field">
      <span class="report-detail-label">Status:</span>
      <span class="report-detail-value" id="detail-status"></span>
    </div>
    <div class="report-detail-field">
      <span class="report-detail-label">Date:</span>
      <span class="report-detail-value" id="detail-date"></span>
    </div>
    <div class="report-detail-field">
      <span class="report-detail-label">Time:</span>
      <span class="report-detail-value" id="detail-time"></span>
    </div>
    <div class="report-detail-field" style="margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.18)">
      <span class="report-detail-label" style="margin-top:0">Note:</span>
      <div class="report-detail-note" id="detail-note"></div>
    </div>
  </div>
</div>

<div class="modal" id="create-report-modal" role="dialog" aria-modal="true" aria-labelledby="create-report-title" hidden>
  <div class="modal-header">
    <h2 class="modal-title" id="create-report-title">Create Report</h2>
    <button class="modal-close" id="create-report-close" aria-label="Close modal">&times;</button>
  </div>
  <div class="modal-content">
    <form id="create-report-form" class="report-form">
      <div class="field">
        <label for="report-device">Device <span style="color:var(--bad)">*</span></label>
        <select id="report-device" required>
          <option value="">Select a device</option>
        </select>
      </div>
      <div class="field">
        <label>Report Type <span style="color:var(--bad)">*</span></label>
        <div class="row" style="gap:16px; flex-wrap:wrap" role="radiogroup" aria-label="Report type">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; flex:1; min-width:140px">
            <input type="radio" name="report-type" value="alert_fixed" checked style="width:18px; height:18px; accent-color:var(--c-start)">
            <span>Alert Fixed</span>
          </label>
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; flex:1; min-width:140px">
            <input type="radio" name="report-type" value="maintenance_complete" style="width:18px; height:18px; accent-color:var(--c-start)">
            <span>Maintenance Complete</span>
          </label>
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; flex:1; min-width:140px">
            <input type="radio" name="report-type" value="broken_device" style="width:18px; height:18px; accent-color:var(--c-start)">
            <span>Broken Device</span>
          </label>
        </div>
      </div>
      <div class="field">
        <label for="report-note">Note (optional)</label>
        <textarea id="report-note" maxlength="500" placeholder="Describe the issue or resolution..."></textarea>
        <div class="char-count" id="note-char-count">0/500 characters</div>
      </div>
      <div class="row" style="justify-content:flex-end; margin-top:8px; gap:10px">
        <button type="button" class="btn btn-ghost" id="create-report-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/telemetry.js"></script>
<script src="js/menu.js"></script>
<script src="js/reports-personnel.js"></script>
</body>
</html>
