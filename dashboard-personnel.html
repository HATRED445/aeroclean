<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personnel dashboard · AeroClean</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body data-allowed="personnel">
<div class="shell">
  <header class="topbar">
    <div class="topbar-start" id="topbar-menu"></div>
    <div class="brand is-left">
      <div class="brand-mark">A</div>
      <div class="brand-name">Aero<span>Clean</span></div>
    </div>
  </header>

  <main class="main">
    <div class="menu-root" id="app-menu"></div>
    <section class="card" style="margin-bottom:20px">
      <div class="hero">
        <div class="hero-avatar" id="avatar">P</div>
        <div>
          <div class="muted" id="greeting">Welcome</div>
          <div class="hero-name" id="full-name">—</div>
          <span class="badge badge-personnel">Personnel</span>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2 class="section-title">Account details</h2>
        <span class="badge badge-active" id="status-badge">Active</span>
      </div>

      <dl class="info-grid">
        <div class="info"><dt>Full name</dt><dd id="f-full-name">—</dd></div>
        <div class="info"><dt>School ID</dt><dd id="f-school-id">—</dd></div>
        <div class="info"><dt>Email</dt><dd id="f-email">—</dd></div>
        <div class="info"><dt>Phone number</dt><dd id="f-phone">—</dd></div>
        <div class="info"><dt>Registered</dt><dd id="f-created">—</dd></div>
        <div class="info"><dt>Approved</dt><dd id="f-reviewed">—</dd></div>
      </dl>

      <p class="hint" style="margin-top:16px">
        Your personnel account was accepted by an administrator, so sign-in is unlocked.
        The administrator can still decline the account later.
      </p>
    </section>
  </main>
</div>

<div id="toast-root"></div>

<script src="js/core.js"></script>
<script src="js/telemetry.js"></script>
<script src="js/menu.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
